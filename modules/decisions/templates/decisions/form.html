{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>{% if object %}{{ object.title }}{% else %}New decision{% endif %}</h1></div></div>
<div class="card" style="max-width:820px">
  <form method="post">{% csrf_token %}
    <div class="form-grid">
      {% for field in form %}<div class="field{% if field.name in form.wide_fields %} wide{% endif %}">{{ field.label_tag }}{{ field }}
        {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}{{ field.errors }}</div>{% endfor %}
    </div>
    <div class="actions"><button type="submit">Save</button><a class="btn secondary" href="{% url 'decisions:index' %}">Cancel</a></div>
  </form>
</div>
{% endblock %}
