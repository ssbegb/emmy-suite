{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>My profile</h1><p class="muted">{{ request.user.email }}</p></div></div>
<div class="card" style="max-width:560px">
  <form method="post">{% csrf_token %}
    <div class="form-grid">{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}</div>
    <button type="submit">Save</button>
    <a class="btn secondary" href="{% url 'account_email' %}">Email addresses</a>
    <a class="btn secondary" href="{% url 'socialaccount_connections' %}">Connected accounts</a>
  </form>
</div>
{% endblock %}
